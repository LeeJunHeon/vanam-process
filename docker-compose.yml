services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: process-web-nextjs
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_TRUST_HOST: "true"
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      GOOGLE_CALENDAR_SUBJECT: ${GOOGLE_CALENDAR_SUBJECT}
      GOOGLE_CALENDAR_KEY_FILE: ${GOOGLE_CALENDAR_KEY_FILE:-/app/secrets/service-account-key.json}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - /volume1/docker/process-web/uploads:/app/uploads
      - /volume1/docker/process-web/secrets:/app/secrets:ro
    networks:
      - vanam-db-net

networks:
  vanam-db-net:
    external: true
