services:
  nextjs:
    # GitHub Actions 가 올린 이미지를 deploy 스크립트가 :deployed 로 태그한다(compose 가 스스로 받지 않음).
    # build 는 비상용(sudo ./deploy*.sh --build)으로 남겨 둔다
    image: ghcr.io/leejunheon/process-web:deployed
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: process-web-nextjs
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_TRUST_HOST: "true"
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      GOOGLE_CALENDAR_SUBJECT: ${GOOGLE_CALENDAR_SUBJECT}
      GOOGLE_CALENDAR_KEY_FILE: ${GOOGLE_CALENDAR_KEY_FILE:-/app/secrets/service-account-key.json}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_INGEST_TOKEN: ${OPS_INGEST_TOKEN}
      # 챔버K v2 구글챗 알림(W-6) — 값은 NAS .env 에(비밀값). 없거나 빈 값이면 보내지 않음(outbox "주소 없음")
      OPS2_CHAT_WEBHOOK_CHK2: ${OPS2_CHAT_WEBHOOK_CHK2:-}
      OPS2_CHAT_ALERT_WEBHOOK_CHK2: ${OPS2_CHAT_ALERT_WEBHOOK_CHK2:-}
    volumes:
      - /volume1/docker/process-web/uploads:/app/uploads
      - /volume1/docker/process-web/secrets:/app/secrets:ro
    networks:
      - vanam-db-net

networks:
  vanam-db-net:
    external: true
